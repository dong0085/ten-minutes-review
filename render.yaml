services:
  - type: cron
    name: ten-minutes-review-jobs
    runtime: node
    plan: 0.5c-512mb
    rootDir: .
    schedule: "*/10 * * * *"
    buildCommand: npm install -g pnpm@10.15.0 && pnpm install --frozen-lockfile
    preDeployCommand: pnpm db:migrate
    startCommand: pnpm --filter worker once
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: LLM_PROVIDER
        value: deepseek
      - key: EMAIL_PROVIDER
        value: resend
      - key: STORAGE_PROVIDER
        value: vercel
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Quiz sender, e.g. Ten Minutes Review <quiz@contact.tenminutesreview.study>.
      # Vercel's EMAIL_FROM is the account-email sender (no-reply@).
      - key: EMAIL_FROM
        sync: false
